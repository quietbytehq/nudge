name: nudge-pinball
title: Nudge
base: core24
version: "0.5.1"
summary: Arcade pinball with space and island tables
description: |
  Nudge is a 3D arcade pinball game by QuietByte. Table one, Cosmic Drift, has
  bumpers on the sun and planets, orbit lanes, a spinner and a black hole that
  swallows the ball. Table two, Paradise Bay, is a bright island table with a
  volcano, surfboard targets and a third flipper. Table three, Alpenglow, is
  a lakeside castle at dusk with shields to light and a castle multiball.
  Table four, Palace Night, is an Arabian palace garden by moonlight with a
  genie lamp, five jewelled doors and a magic carpet ramp. Includes a follow camera, a top-ten table and three
  graphics quality levels for slower graphics chips.
grade: stable
confinement: strict
license: Apache-2.0
contact: quietbyte.2026@gmail.com
icon: assets/logo/nudge-512.png

apps:
  nudge-pinball:
    command: usr/bin/nudge
    desktop: usr/share/applications/nudge.desktop
    extensions: [gnome]
    plugs:
      - opengl
      - audio-playback
      - joystick
      - network

parts:
  nudge-pinball:
    plugin: dump
    source: dist/nudge_0.5.1_amd64.deb
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/nudge.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/nudge.desktop"
