name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL --retry 5 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 5 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf godot.zip templates.tpz templates
      - name: Import assets and run physics tests
        run: |
          godot --headless --path . --import
          godot --headless --path . -s tests/sim_test.gd
      - name: Export Linux and Windows builds
        run: |
          mkdir -p build/linux build/windows
          godot --headless --path . --export-release "Linux" build/linux/nudge.x86_64
          godot --headless --path . --export-release "Windows Desktop" build/windows/Nudge.exe
          test -s build/linux/nudge.x86_64 && test -s build/windows/Nudge.exe
      - name: Package
        run: |
          set -e
          VERSION=$(grep -oP 'config/version="\K[^"]+' project.godot)
          curl -fsSL --retry 5 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" packaging/build_linux.sh "$VERSION"
          cp LICENSE NOTICE build/windows/
          (cd build/windows && zip -qr "../../dist/Nudge-$VERSION-windows-x86_64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  snap:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
